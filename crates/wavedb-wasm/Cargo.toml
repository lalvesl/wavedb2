[package]
name = "wavedb-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Anchors the whole client stack (`Db`, `NetClient`, the platform `fetch`
# tunnel) into the wasm artifact — what the size tracker measures.
wavedb = { path = "../wavedb" }

# WASM-only dependencies — compiled only when targeting wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
# `IdbStore` bridges IndexedDB's event-driven requests to futures via a
# oneshot channel per operation.
futures = { workspace = true }
# The probe drives the transport below the typed surface (raw frames).
wavedb-core = { path = "../wavedb-core" }
wavedb-net = { path = "../wavedb-net" }
# The IndexedDB `Store` backend: one `kv` object store, `Id → wire bytes`.
web-sys = { workspace = true, features = [
  "DomException",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "Window",
] }

[dev-dependencies]
wasm-bindgen-test = { workspace = true }
# The browser test drives the typed surface (LocalHandle + Collection)
# over `IdbStore` with a real schema crate — serverless mode.
schema-smoke = { path = "../../examples/schema-smoke" }
# The live-node demo (the M5 exit) drives contact-book's exposed schema
# against a running node — see `tests/live_node.rs`.
contact-book = { path = "../../examples/contact-book" }
futures = { workspace = true }
